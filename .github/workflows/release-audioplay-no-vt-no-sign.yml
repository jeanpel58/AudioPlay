name: Release AudioPlay (sans VirusTotal, sans signature)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-no-vt-no-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
        mode: [fdd, scd]

    env:
      PROJECT_PATH: AudioPlay/AudioPlay.vbproj
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET + cache NuGet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.vbproj
            **/*.fsproj
            **/packages.lock.json
            **/Directory.Packages.props

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} --nologo

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore --nologo

      - name: Publish (${{ matrix.runtime }} / ${{ matrix.mode }})
        shell: pwsh
        run: |
          $selfContained = if ("${{ matrix.mode }}" -eq "scd") { "true" } else { "false" }
          $outDir = "AudioPlay/publish/${{ matrix.runtime }}-${{ matrix.mode }}"
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -r "${{ matrix.runtime }}" `
            --self-contained $selfContained `
            --no-restore `
            --nologo `
            -o $outDir

      - name: Create ZIP
        shell: pwsh
        run: |
          $outDir = "AudioPlay/publish/${{ matrix.runtime }}-${{ matrix.mode }}"
          $zip = "AudioPlay-${{ matrix.runtime }}-${{ matrix.mode }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$outDir\*" -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlay-${{ matrix.runtime }}-${{ matrix.mode }}
          path: AudioPlay-${{ matrix.runtime }}-${{ matrix.mode }}.zip

      - name: Create/Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AudioPlay-${{ matrix.runtime }}-${{ matrix.mode }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
